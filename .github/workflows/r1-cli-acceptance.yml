name: R1 CLI acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  r1_cli_acceptance:
    name: R1 CLI acceptance (semantic-only, strict audit + scenario benchmark mode)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package (sir entrypoint must exist)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          command -v sir

      - name: Create one ephemeral signing key (reused in this job)
        run: |
          set -euo pipefail
          openssl genrsa -out /tmp/sir_ci_priv.pem 2048 >/dev/null 2>&1
          openssl rsa -in /tmp/sir_ci_priv.pem -pubout -out /tmp/sir_ci_pub.pem >/dev/null 2>&1

          # A signer refuses unless the registry entry named by
          # SDL_SIGNING_KEY_ID holds the public key belonging to the key in
          # hand, so an ephemeral key has to be enrolled exactly as a real one
          # is. The id is descriptive rather than borrowed. The verification
          # steps below resolve it through this same registry: a certificate
          # or a receipt that names a key is checked against the registry's
          # entry for that key and against nothing else. Until 21 November
          # 2026 they pointed at a deliberately missing registry and passed
          # the public key, which worked through a fallback that was removed.
          python - <<'PY'
          import json, pathlib
          pathlib.Path("/tmp/sir_ci_key_registry.json").write_text(json.dumps({
              "keys": [{
                  "key_id": "ci-ephemeral",
                  "pubkey_pem": pathlib.Path("/tmp/sir_ci_pub.pem").read_text(),
                  "status": "approved",
              }]
          }), encoding="utf-8")
          PY

          # Mask the key line by line before it enters the environment. It is
          # generated per run, signs nothing that is published, and dies with
          # the job, so this is disclosure hygiene and not a credential. But
          # three later steps carry it in `env:`, and the runner prints a
          # step's env block, so without this the whole BEGIN PRIVATE KEY
          # block stands in a public log and reads to anyone scrolling past as
          # a leaked signing key. On a repository whose claim is that its
          # evidence survives inspection, looking like a leak costs something.
          # Per line because add-mask matches a line at a time.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < /tmp/sir_ci_priv.pem

          {
            echo "SDL_PRIVATE_KEY_PEM<<EOF"
            cat /tmp/sir_ci_priv.pem
            echo "EOF"
            echo "SDL_SIGNING_KEY_ID=ci-ephemeral"
            echo "SDL_KEY_REGISTRY=/tmp/sir_ci_key_registry.json"
          } >> "$GITHUB_ENV"

      - name: Run audit mode (generic_safety)
        run: |
          set -euo pipefail
          sir run --mode audit --pack generic_safety
          test -f proofs/run_summary.json

      - name: Validate evidence artefact semantics (audit summary)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s = json.load(open("proofs/run_summary.json", "r", encoding="utf-8"))

          assert s.get("pack_id") == "generic_safety", s

          if "suite_name" in s:
              assert s.get("suite_name") == "generic_safety", s

          assert s.get("proof_class") == "FIREWALL_ONLY_AUDIT", s
          assert int(s.get("prompts_tested", 0)) > 0, s
          assert int(s.get("jailbreaks_leaked", -1)) == 0, s
          assert int(s.get("harmless_blocked", -1)) == 0, s
          assert int(s.get("provider_call_attempts", -1)) == 0, s
          assert int(s.get("provider_call_successes", -1)) == 0, s
          assert int(s.get("provider_call_failures", -1)) == 0, s
          print("OK: audit summary semantic checks passed")
          PY

      - name: Generate cert from current run and validate certificate contract (audit)
        id: generate_audit_certificate
        env:
          SDL_PRIVATE_KEY_PEM: ${{ env.SDL_PRIVATE_KEY_PEM }}
          SDL_SIGNING_KEY_ID: ${{ env.SDL_SIGNING_KEY_ID }}
          SDL_KEY_REGISTRY: ${{ env.SDL_KEY_REGISTRY }}
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          python tools/generate_certificate.py | tee "$output_file"

          cert_path="$(
            sed -n 's/^OUTPUT_AUDIT_JSON=//p' "$output_file" |
              tail -n 1
          )"

          case "$cert_path" in
            proofs/latest-audit.json|proofs/local-audit.json)
              ;;
            *)
              echo "ERROR: generate_certificate.py did not emit a valid OUTPUT_AUDIT_JSON path."
              exit 1
              ;;
          esac

          test -f "$cert_path"
          python tools/validate_certificate_contract.py "$cert_path"
          echo "audit_json=$cert_path" >> "$GITHUB_OUTPUT"

      - name: CLI verify smoke (cert path + stdin)
        env:
          AUDIT_JSON: ${{ steps.generate_audit_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail
          test -f "$AUDIT_JSON"
          sir verify cert --key /tmp/sir_ci_pub.pem --key-registry /tmp/sir_ci_key_registry.json "$AUDIT_JSON"
          cat "$AUDIT_JSON" | sir verify cert --key /tmp/sir_ci_pub.pem --key-registry /tmp/sir_ci_key_registry.json --no-ledger -

      - name: Run scenario mode (scenario_injection_chain)
        run: |
          set -euo pipefail
          sir run --mode scenario --pack scenario_injection_chain
          test -f proofs/run_summary.json

      - name: Validate evidence artefact semantics (scenario summary)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s = json.load(open("proofs/run_summary.json", "r", encoding="utf-8"))

          assert s.get("pack_id") == "scenario_injection_chain", s

          if "suite_name" in s:
              assert s.get("suite_name") == "scenario_injection_chain", s

          assert s.get("scenario_id"), s

          assert s.get("proof_class") == "SCENARIO_AUDIT", s
          assert int(s.get("prompts_tested", 0)) > 0, s
          assert int(s.get("provider_call_attempts", -1)) == 0, s
          assert int(s.get("provider_call_successes", -1)) == 0, s
          assert int(s.get("provider_call_failures", -1)) == 0, s
          print("OK: scenario summary semantic checks passed")
          PY

      - name: Generate cert from scenario run and validate certificate contract
        id: generate_scenario_certificate
        env:
          SDL_PRIVATE_KEY_PEM: ${{ env.SDL_PRIVATE_KEY_PEM }}
          SDL_SIGNING_KEY_ID: ${{ env.SDL_SIGNING_KEY_ID }}
          SDL_KEY_REGISTRY: ${{ env.SDL_KEY_REGISTRY }}
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          python tools/generate_certificate.py | tee "$output_file"

          cert_path="$(
            sed -n 's/^OUTPUT_AUDIT_JSON=//p' "$output_file" |
              tail -n 1
          )"

          case "$cert_path" in
            proofs/latest-audit.json|proofs/local-audit.json)
              ;;
            *)
              echo "ERROR: generate_certificate.py did not emit a valid OUTPUT_AUDIT_JSON path."
              exit 1
              ;;
          esac

          test -f "$cert_path"
          python tools/validate_certificate_contract.py "$cert_path"
          echo "audit_json=$cert_path" >> "$GITHUB_OUTPUT"

      - name: CLI verify smoke (cert path + stdin after scenario)
        env:
          AUDIT_JSON: ${{ steps.generate_scenario_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail
          test -f "$AUDIT_JSON"
          sir verify cert --key /tmp/sir_ci_pub.pem --key-registry /tmp/sir_ci_key_registry.json "$AUDIT_JSON"
          cat "$AUDIT_JSON" | sir verify cert --key /tmp/sir_ci_pub.pem --key-registry /tmp/sir_ci_key_registry.json --no-ledger -

      - name: Create archive and verify archive via CLI
        env:
          SDL_PRIVATE_KEY_PEM: ${{ env.SDL_PRIVATE_KEY_PEM }}
          SDL_SIGNING_KEY_ID: ${{ env.SDL_SIGNING_KEY_ID }}
          SDL_KEY_REGISTRY: ${{ env.SDL_KEY_REGISTRY }}
          AUDIT_JSON: ${{ steps.generate_scenario_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail
          test -f "$AUDIT_JSON"
          # This step archives proofs/itgl_final_hash.txt, so it is a publishing
          # step and has to write that file from this run's ledger. The file is
          # tracked, so without this the checkout's copy is another run's and
          # publish_run.py refuses it.
          python tools/verify_itgl.py --ledger proofs/itgl_ledger.jsonl --write-hash proofs/itgl_final_hash.txt
          python tools/publish_run.py --cert "$AUDIT_JSON" \
            --copy proofs/itgl_ledger.jsonl \
            --copy proofs/itgl_final_hash.txt \
            --copy proofs/latest-attempts.log \
            --copy proofs/run_summary.json \
            --copy leaks_count.txt \
            --copy harmless_blocked.txt
          RUN_DIR="$(
            find proofs/runs -mindepth 1 -maxdepth 1 -type d ! -name pairs | while read -r d; do
              if [ -f "$d/manifest.json" ] && [ -f "$d/archive_receipt.json" ]; then
                echo "$d"
              fi
            done | sort | tail -n 1
          )"
          if [ -z "${RUN_DIR}" ]; then
            echo "ERROR: no run archive directory found under proofs/runs/"
            exit 1
          fi
          sir verify archive --key /tmp/sir_ci_pub.pem --key-registry /tmp/sir_ci_key_registry.json "$RUN_DIR"

      - name: Live mode fails fast without credentials (no stale summary)
        run: |
          set -euo pipefail

          rm -f proofs/run_summary.json

          set +e
          output="$(sir run --mode live --pack generic_safety 2>&1)"
          code=$?
          set -e

          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "ERROR: live run unexpectedly succeeded without credentials"
            exit 1
          fi
          echo "$output" | grep -F "requires your own provider credentials"

          if [ -f proofs/run_summary.json ]; then
            python -c 'import json; s=json.load(open("proofs/run_summary.json", "r", encoding="utf-8")); assert int(s.get("provider_call_attempts", 0)) == 0, s; print("OK: fail-fast emitted summary with provider_call_attempts == 0")'
          else
            echo "OK: fail-fast emitted no summary"
          fi
