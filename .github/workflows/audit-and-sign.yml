name: SIR Real Governance Audit

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'proofs/**'
      - 'docs/**'
      - 'policy/isc_policy.signed.json'
      # The publication step regenerates the archive figures the README carries,
      # so a published proof touches README.md. Without this a merged proof
      # pull request would start another audit, which would publish another
      # proof. paths-ignore only suppresses a commit that touches nothing else,
      # so a README change made alongside code still triggers the audit.
      - 'README.md'

  workflow_dispatch:
    inputs:
      operation:
        description: 'run = single run; benchmark = paired ungated vs gated.'
        required: false
        default: run
        type: choice
        options:
          - run
          - benchmark
      mode:
        description: 'audit = deterministic/no provider calls; live = provider-call path. A benchmark requires live.'
        required: false
        default: audit
        type: choice
        options:
          - audit
          - live
      pack:
        description: 'Exact pack id from controlled workflow list.'
        required: false
        default: generic_safety
        type: choice
        options:
          - generic_safety
          - support_operator_override
          - data_exfiltration_pressure
          - eu_ai_act_compliance_pressure
      model:
        description: 'Exact model id from controlled workflow list.'
        required: false
        default: grok-4.3
        type: choice
        options:
          - grok-3-beta
          - grok-4.3
          - grok-4.20-0309-reasoning
          - grok-4.20-0309-non-reasoning
          - gpt-4.1-mini
          - gpt-4.1
          - gpt-5-mini
          - gpt-5.4-mini
          - gpt-5.5
      provider:
        description: 'Provider id for model execution.'
        required: false
        default: xai
        type: choice
        options:
          - xai
          - openai

# Hardening: prevent overlapping runs from fighting over commits / pages.
concurrency:
  group: sir-audit-and-sign-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The certificate records which key signed it. generate_certificate.py falls back to
  # "default", so rotating the signing secret without setting this would stamp every
  # certificate with the wrong key id and fail verification for everyone outside CI.
  # Set the SDL_SIGNING_KEY_ID repository variable as part of a key rotation.
  SDL_SIGNING_KEY_ID: ${{ vars.SDL_SIGNING_KEY_ID || 'default' }}

jobs:
  audit-and-sign:
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.operation || 'run') != 'benchmark' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Proof artefacts reach main through a pull request, so the job opens one.
      pull-requests: write
    env:
      CANONICAL_PUBLICATION_CONTEXT: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Canonical main publication uses the configured push token; other supported runs use github.token.
          token: ${{ github.ref == 'refs/heads/main' && secrets.SIR_AUDIT_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clean install SIR governance gate (NO CACHE)
        env:
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'audit' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip uninstall -y sir-firewall sir_firewall || true

          mode="${DISPATCH_MODE:-audit}"
          echo "Install mode: $mode"

          if [ "$mode" = "live" ]; then
            pip install --no-cache-dir --force-reinstall -e ".[live]"
          else
            pip install --no-cache-dir --force-reinstall -e .
          fi

          python -c "import sir_firewall.core as c; print('LOADED FROM →', c.__file__); print('USE_SEMANTIC_CHECK IS →', c.USE_SEMANTIC_CHECK)"

      - name: Validate pack registry (v1)
        run: |
          set -euo pipefail
          python tools/validate_pack_registry.py --file spec/packs/pack_registry.v1.json

      - name: Ensure generic_safety maps to active suite path
        env:
          SIR_SUITE_PATH: tests/domain_packs/generic_safety.csv
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          suite_path = os.environ["SIR_SUITE_PATH"]
          with open("spec/packs/pack_registry.v1.json", "r", encoding="utf-8") as f:
              registry = json.load(f)

          packs = registry.get("packs", [])
          match = next((p for p in packs if p.get("pack_id") == "generic_safety"), None)
          if match is None:
              print("ERROR: generic_safety pack_id is missing from registry", file=sys.stderr)
              raise SystemExit(1)
          if match.get("suite_path") != suite_path:
              print(
                  "ERROR: generic_safety suite_path mismatch "
                  f"(registry={match.get('suite_path')!r}, env={suite_path!r})",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"OK: generic_safety -> {suite_path}")
          PY

      - name: Validate run selection tuple
        env:
          DISPATCH_OPERATION: ${{ github.event.inputs.operation || 'run' }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'audit' }}
          DISPATCH_PACK: ${{ github.event.inputs.pack || 'generic_safety' }}
          DISPATCH_PROVIDER: ${{ github.event.inputs.provider || 'xai' }}
          DISPATCH_MODEL: ${{ github.event.inputs.model || 'grok-4.3' }}
        run: |
          set -euo pipefail
          python tools/validate_run_selection.py \
            --operation "${DISPATCH_OPERATION}" \
            --mode "${DISPATCH_MODE}" \
            --pack "${DISPATCH_PACK}" \
            --provider "${DISPATCH_PROVIDER}" \
            --model "${DISPATCH_MODEL}"

      - name: Validate active pack schema
        env:
          DISPATCH_PACK: ${{ github.event.inputs.pack || 'generic_safety' }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'audit' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          pack_id = os.environ.get("DISPATCH_PACK", "generic_safety").strip()
          mode = os.environ.get("DISPATCH_MODE", "audit").strip()
          with open("spec/packs/pack_registry.v1.json", "r", encoding="utf-8") as f:
              registry = json.load(f)
          packs = registry.get("packs", [])
          match = next((p for p in packs if p.get("pack_id") == pack_id), None)
          if not match:
              print(f"ERROR: pack_id not found in registry: {pack_id}", file=sys.stderr)
              active_pack_ids = [
                  p.get("pack_id")
                  for p in packs
                  if p.get("status") == "active"
              ]
              print("Active pack_id values:", ", ".join(sorted(pid for pid in active_pack_ids if pid)), file=sys.stderr)
              raise SystemExit(1)

          schema = match.get("schema")
          suite_path = match.get("suite_path")

          if mode in {"audit", "live"} and schema != "csv_single_turn_v1":
              print(
                  'ERROR: workflow input "mode" values audit/live require a domain CSV pack '
                  "(schema csv_single_turn_v1). "
                  f"pack_id {pack_id!r} has schema {schema!r}.",
                  file=sys.stderr,
              )
              print(
                  "Use a domain pack_id (for example: generic_safety or support_operator_override) "
                  "or run scenario packs via the CLI with --mode scenario.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if schema == "scenario_json_v1":
              cmd = ["python", "tools/validate_scenario_pack.py", "--file", suite_path]
          else:
              cmd = ["python", "tools/validate_domain_pack.py", "--file", suite_path]
          print("Running:", " ".join(cmd))
          raise SystemExit(subprocess.call(cmd))
          PY

      - name: Run canary_fail systemic-reset accounting meta-test
        run: |
          set -euo pipefail
          # This deliberately runs outside the benchmark allowlist. The test executes
          # canary_fail through the runner, generates its certificate, and rejects
          # AUDIT PASSED so a reset block can never earn expected-block credit.
          pytest -q \
            tests/test_systemic_reset_accounting.py::test_canary_fail_systemic_reset_is_inconclusive

      - name: Run selected SIR audit mode
        env:
          # Live reference target
          LITELLM_MODEL: ${{ github.event.inputs.model || 'grok-4.3' }}
          SIR_PROVIDER: ${{ github.event.inputs.provider || 'xai' }}

          # Template selection
          SIR_TEMPLATE_ID: "EU-AI-Act-ISC-v1"
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'audit' }}
          DISPATCH_PACK: ${{ github.event.inputs.pack || 'generic_safety' }}
          DISPATCH_PROVIDER: ${{ github.event.inputs.provider || 'xai' }}
          DISPATCH_MODEL: ${{ github.event.inputs.model || 'grok-4.3' }}
          SIR_MODEL_CALLS: ${{ (github.event.inputs.mode == 'live') && '1' || '0' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mode="${DISPATCH_MODE:-audit}"
          provider="${DISPATCH_PROVIDER:-xai}"
          pack="${DISPATCH_PACK:-generic_safety}"
          model="${DISPATCH_MODEL:-grok-4.3}"
          if [ -z "${pack}" ]; then pack="generic_safety"; fi
          if [ -z "${provider}" ]; then provider="xai"; fi
          if [ -z "${model}" ]; then model="grok-4.3"; fi
          echo "Mode: $mode"
          echo "Provider: $provider"
          echo "Pack: $pack"
          echo "Model: $model"
          echo "SIR_MODEL_CALLS live-mode flag: $SIR_MODEL_CALLS"
          echo "Reference model: $LITELLM_MODEL"
          echo "SIR_PROVIDER: $SIR_PROVIDER"
          echo "SIR_TEMPLATE_ID: $SIR_TEMPLATE_ID"
          if [ "$mode" = "live" ]; then
            if [ "$provider" = "xai" ] && [ -z "${XAI_API_KEY:-}" ]; then
              echo "ERROR: live mode requested for provider=xai but XAI_API_KEY is not configured."
              exit 1
            fi
            if [ "$provider" = "openai" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "ERROR: live mode requested for provider=openai but OPENAI_API_KEY is not configured."
              exit 1
            fi
            python red_team_suite.py --mode live --pack "$pack" --provider "$provider" --model "$model"
          else
            python red_team_suite.py --mode audit --pack "$pack" --provider "$provider" --model "$model"
          fi

      - name: Compute audit verdict (PASS/FAIL) from counters
        if: always()
        # The shell lives in tools/ci_audit_verdict.sh so that one copy of
        # the rule serves this job, the tests, and the verdict canary.
        run: bash tools/ci_audit_verdict.sh

      - name: Verify ITGL ledger hash chain and export ITGL_FINAL_HASH
        if: always()
        run: |
          set -euo pipefail
          ITGL_LEDGER_PATH="$(python - <<'PY'
          import json
          from pathlib import Path
          from sir_firewall.evidence_paths import canonical_ledger_path
          summary = json.loads(Path('proofs/run_summary.json').read_text(encoding='utf-8'))
          path = canonical_ledger_path(str(summary.get('run_id') or ''))
          if str(summary.get('ledger_path') or '') != str(path):
              raise SystemExit('ERROR: run summary ledger identity mismatch')
          print(path)
          PY
          )"
          echo "ITGL_LEDGER_PATH=$ITGL_LEDGER_PATH" >> "$GITHUB_ENV"
          python tools/verify_itgl.py --ledger "$ITGL_LEDGER_PATH" | tee itgl_env.txt

          if grep '^ITGL_FINAL_HASH=' itgl_env.txt >> "$GITHUB_ENV"; then
            echo "ITGL_FINAL_HASH exported to GITHUB_ENV"
          else
            echo "WARNING: ITGL_FINAL_HASH not found in verify_itgl output"
          fi

      - name: Sign ISC policy file
        if: always()
        env:
          SDL_PRIVATE_KEY_PEM: ${{ secrets.SDL_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          python tools/sign_policy.py

      - name: Generate signed certificate + HTML
        id: generate_certificate
        if: always()
        env:
          SDL_PRIVATE_KEY_PEM: ${{ secrets.SDL_PRIVATE_KEY_PEM }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          python tools/generate_certificate.py | tee "$output_file"

          cert_path="$(
            sed -n 's/^OUTPUT_AUDIT_JSON=//p' "$output_file" |
              tail -n 1
          )"

          case "$cert_path" in
            proofs/latest-audit.json|proofs/local-audit.json)
              ;;
            *)
              echo "ERROR: generate_certificate.py did not emit a valid OUTPUT_AUDIT_JSON path."
              exit 1
              ;;
          esac

          if [ ! -f "$cert_path" ]; then
            echo "ERROR: generated certificate does not exist: $cert_path"
            exit 1
          fi

          echo "audit_json=$cert_path" >> "$GITHUB_OUTPUT"
          live_updated="$(sed -n 's/^OUTPUT_LIVE_AUDIT_UPDATED=//p' "$output_file" | tail -n 1)"
          echo "live_audit_updated=${live_updated:-false}" >> "$GITHUB_OUTPUT"
          echo "Current-run certificate: $cert_path"

      - name: Validate certificate contract
        if: always()
        env:
          AUDIT_JSON: ${{ steps.generate_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail

          if [ -z "${AUDIT_JSON:-}" ] || [ ! -f "$AUDIT_JSON" ]; then
            # Fails rather than skipping. A certificate is produced for failed and
            # inconclusive runs too, because the archive holds artefacts for both
            # passes and failures, so an absent one is a defect and not a state to
            # step over. This printed SKIP and exited 0 until 12 October, which
            # meant a green job was compatible with nothing having been verified:
            # the finalize step's missing-certificate net is gated on the
            # publication context, so it does not apply on a branch, and a branch
            # dispatch is exactly what the key custody procedure tells us to trust
            # before calling a rotation or a version bump done.
            echo "ERROR: generate_certificate.py produced no current-run certificate path, so this step verified nothing."
            exit 1
          fi

          python tools/validate_certificate_contract.py "$AUDIT_JSON"

      - name: Verify certificate signature
        if: always()
        env:
          AUDIT_JSON: ${{ steps.generate_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail

          if [ -z "${AUDIT_JSON:-}" ] || [ ! -f "$AUDIT_JSON" ]; then
            # Fails rather than skipping. A certificate is produced for failed and
            # inconclusive runs too, because the archive holds artefacts for both
            # passes and failures, so an absent one is a defect and not a state to
            # step over. This printed SKIP and exited 0 until 12 October, which
            # meant a green job was compatible with nothing having been verified:
            # the finalize step's missing-certificate net is gated on the
            # publication context, so it does not apply on a branch, and a branch
            # dispatch is exactly what the key custody procedure tells us to trust
            # before calling a rotation or a version bump done.
            echo "ERROR: generate_certificate.py produced no current-run certificate path, so this step verified nothing."
            exit 1
          fi

          # --require-registry so CI verifies the way a third party does. Without it the
          # verifier falls back to spec/sdl.pub, which rotation rewrites, so a key id that
          # disagreed with the registry would pass here and fail for everyone else.
          python tools/verify_certificate.py "$AUDIT_JSON" --ledger "$ITGL_LEDGER_PATH" \
            --require-registry

      - name: Archive this run (P6 truth-preserving per-run archive)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          SDL_PRIVATE_KEY_PEM: ${{ secrets.SDL_PRIVATE_KEY_PEM }}
          AUDIT_JSON: ${{ steps.generate_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail

          if [ -z "${AUDIT_JSON:-}" ] || [ ! -f "$AUDIT_JSON" ]; then
            # Fails rather than skipping. A certificate is produced for failed and
            # inconclusive runs too, because the archive holds artefacts for both
            # passes and failures, so an absent one is a defect and not a state to
            # step over. This printed SKIP and exited 0 until 12 October, which
            # meant a green job was compatible with nothing having been verified:
            # the finalize step's missing-certificate net is gated on the
            # publication context, so it does not apply on a branch, and a branch
            # dispatch is exactly what the key custody procedure tells us to trust
            # before calling a rotation or a version bump done.
            echo "ERROR: generate_certificate.py produced no current-run certificate path, so this step verified nothing."
            exit 1
          fi

          python tools/publish_run.py \
            --cert "$AUDIT_JSON" \
            --copy proofs/itgl_ledger.jsonl \
            --copy proofs/itgl_final_hash.txt \
            --copy proofs/latest-attempts.log \
            --copy proofs/run_summary.json \
            --copy itgl_env.txt \
            --copy leaks_count.txt \
            --copy harmless_blocked.txt

      - name: Prepare docs/ for GitHub Pages
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          mkdir -p docs
          touch docs/.nojekyll

      - name: Publish run archive to docs/runs (PASS or FAIL)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          rm -rf docs/runs || true
          cp -R proofs/runs docs/runs
          python tools/prepare_run_archive_page.py docs/runs/index.html

      - name: Validate published run archive index JSON
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          test -f proofs/runs/index.json
          test -f docs/runs/index.json
          python -m json.tool proofs/runs/index.json >/dev/null
          python -m json.tool docs/runs/index.json >/dev/null

      - name: Publish monitor summary to docs/
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          python tools/generate_monitor_summary.py \
            --index proofs/runs/index.json \
            --out docs/monitor-summary.json \
            --window 20

      - name: Publish latest run marker to docs/ (always)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUDIT_JSON: ${{ steps.generate_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          # The recognised results are declared once, in tools/certificate_results.py.
          sys.path.insert(0, str(Path("tools").resolve()))
          from certificate_results import UnrecognisedResult, status_for

          audit_path_raw = os.environ.get("AUDIT_JSON", "").strip()
          if not audit_path_raw:
              raise SystemExit("ERROR: current-run certificate path is unavailable")

          audit_path = Path(audit_path_raw)
          if not audit_path.is_file():
              raise SystemExit(f"ERROR: current-run certificate does not exist: {audit_path}")

          try:
              certificate = json.loads(audit_path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: failed to read current-run certificate {audit_path}: {exc}"
              ) from exc

          if not isinstance(certificate, dict):
              raise SystemExit(
                  f"ERROR: current-run certificate must be a JSON object: {audit_path}"
              )

          # D5: baseline records are not runs for the single-run truth
          # surfaces. A record carries no result, so reading one here would
          # publish a verdict for a run with no gate in it.
          if "record_kind" in certificate:
              raise SystemExit(
                  f"ERROR: {audit_path} is not an audit certificate: "
                  f"record_kind={certificate['record_kind']!r}"
              )

          result = certificate.get("result")
          try:
              status, audit_pass, inconclusive = status_for(result)
          except UnrecognisedResult:
              raise SystemExit(
                  f"ERROR: unsupported current-run certificate result: {result!r}"
              )

          def has_itgl_env_hash() -> bool:
              try:
                  return any(
                      line.startswith("ITGL_FINAL_HASH=")
                      for line in Path("itgl_env.txt").read_text(encoding="utf-8").splitlines()
                  )
              except (OSError, UnicodeError):
                  return False


          evidence_checks = (
              ("proofs/run_summary.json", Path("proofs/run_summary.json").is_file()),
              ("proofs/itgl_final_hash.txt", Path("proofs/itgl_final_hash.txt").is_file()),
              ("ITGL_FINAL_HASH= in itgl_env.txt", has_itgl_env_hash()),
          )
          missing_evidence_artifacts = [
              identifier for identifier, present in evidence_checks if not present
          ]
          evidence_artifacts_complete = not missing_evidence_artifacts
          for identifier in missing_evidence_artifacts:
              print(f"::warning::{identifier} is missing")

          run_id_path = Path("proofs/run_id.txt")
          archive_run_id = (
              run_id_path.read_text(encoding="utf-8").strip()
              if run_id_path.is_file()
              else "unknown"
          )

          repository = os.environ.get("GITHUB_REPOSITORY", "")
          github_run_id = os.environ.get("GITHUB_RUN_ID", "")
          ci_run_url = f"https://github.com/{repository}/actions/runs/{github_run_id}"
          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          latest_run_payload = {
              "status": status,
              "audit_pass": audit_pass,
              "inconclusive": inconclusive,
              "evidence_artifacts_complete": evidence_artifacts_complete,
              "missing_evidence_artifacts": missing_evidence_artifacts,
              "leaks": int(certificate.get("jailbreaks_leaked", 0)),
              "harmless_blocked": int(certificate.get("harmless_blocked", 0)),
              "run_id": archive_run_id,
              "sha": os.environ.get("GITHUB_SHA", ""),
              "repository": repository,
              "ci_run_url": ci_run_url,
              "timestamp_utc": stamp,
          }

          out_path = Path("docs/latest-run.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(
              json.dumps(latest_run_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"INCONCLUSIVE={'true' if inconclusive else 'false'}\n")
              env_file.write(f"LATEST_RUN_STATUS={status}\n")
              env_file.write(f"LATEST_ARCHIVE_RUN_ID={archive_run_id}\n")
              env_file.write(f"LATEST_CI_RUN_URL={ci_run_url}\n")
              env_file.write(f"CERT_RESULT_STATUS={status}\n")

          print("Wrote docs/latest-run.json from current-run certificate result:")
          print(json.dumps(latest_run_payload, ensure_ascii=False, indent=2))
          PY

      - name: Publish latest PASS proof to docs/ (PASS only)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true' && steps.generate_certificate.outputs.audit_json == 'proofs/latest-audit.json'
        run: |
          set -euo pipefail
          test -f proofs/latest-audit.html
          test -f proofs/latest-audit.json
          cp -f proofs/latest-audit.html docs/latest-audit.html
          cp -f proofs/latest-audit.json docs/latest-audit.json

      - name: Publish latest live proof to docs/ (successful provider call)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true' && steps.generate_certificate.outputs.live_audit_updated == 'true'
        run: |
          set -euo pipefail
          test -f proofs/latest-live-audit.html
          test -f proofs/latest-live-audit.json
          cp -f proofs/latest-live-audit.html docs/latest-live-audit.html
          cp -f proofs/latest-live-audit.json docs/latest-live-audit.json

      - name: Upload proof artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SIR-Audit-Proof
          if-no-files-found: ignore
          path: |
            proofs/latest-audit.json
            proofs/latest-audit.html
            proofs/latest-live-audit.json
            proofs/latest-live-audit.html
            proofs/local-audit.json
            proofs/local-audit.html
            proofs/itgl_ledger.jsonl
            proofs/itgl_final_hash.txt
            proofs/run_summary.json
            proofs/latest-attempts.log
            proofs/run_id.txt
            proofs/runs/*-gh${{ github.run_id }}*/
            policy/isc_policy.json
            policy/isc_policy.signed.json
            spec/sdl.pub
            spec/pubkeys/key_registry.v1.json
            leaks_count.txt
            harmless_blocked.txt
            content_evaluated.txt
            itgl_env.txt

      # Proof artefacts reach main through a pull request, not a direct push.
      #
      # This pushed straight to main until 12 October, and the first run after
      # the 2.4.0 merge could not publish: the Protect Main ruleset declined it
      # with "4 of 4 required status checks are expected", because a direct push
      # from automation arrives with no checks against it. That is item 0's
      # freeze mechanism working, and this workflow had been relying on doing
      # exactly what item 0 set out to prevent.
      #
      # A pull request keeps the ruleset intact and means every published
      # archive arrives on a path where the required checks ran. The audit is
      # already complete and verified by this point, so a pending pull request
      # delays publication rather than invalidating the run, and an open pull
      # request is visible rather than silent.
      #
      # This cannot recurse: the push trigger ignores proofs/**, docs/** and
      # policy/isc_policy.signed.json, which is everything a proof branch
      # touches, and this workflow has no pull_request trigger.
      - name: Open a pull request with the proof files (archive always; latest PASS + sidecars only)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          AUDIT_JSON: ${{ steps.generate_certificate.outputs.audit_json }}
          LIVE_AUDIT_UPDATED: ${{ steps.generate_certificate.outputs.live_audit_updated }}
          # A pull request opened with GITHUB_TOKEN is authored by the Actions
          # bot, and GitHub deliberately does not let that event start further
          # workflows. The required status checks therefore never ran on a proof
          # pull request, which reported as "4 workflows awaiting approval" and
          # left publication permanently pending. SIR_AUDIT_PUSH_TOKEN is the
          # token this workflow already checks out with on main, so the pull
          # request is opened by the same identity that pushed the branch and its
          # checks run. It needs pull-requests write in addition to the contents
          # write it already carries; editing a token's permissions does not
          # change its value, so the secret does not have to be re-entered.
          #
          # This is only safe because the audit workflow has no pull_request
          # trigger: with one, a proof pull request would start another audit,
          # which would publish another proof. tests/
          # test_audit_workflow_cannot_pass_without_verifying.py refuses that
          # trigger and checks that paths-ignore covers everything the
          # publication steps stage.
          #
          # The fallback keeps a fork or a repository without the secret working
          # at the old behaviour rather than failing to publish at all. When the
          # token expires the step reports publication pending, not failed.
          GH_TOKEN: ${{ secrets.SIR_AUDIT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          # A second credential was considered and rejected: this token already
          # holds contents write on this repository, so pull-requests write adds
          # strictly less capability than it has, while a second token would add
          # a second expiry date with its own undocumented failure mode.
        run: |
          set -euo pipefail

          git config user.name "SIR Audit Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Absent counters are reported as unknown, never as zero. This commit
          # message is part of the published record, so it must not claim a
          # clean result for a run that produced no counters to read.
          leaks="$(cat leaks_count.txt 2>/dev/null || echo unknown)"
          harmless="$(cat harmless_blocked.txt 2>/dev/null || echo unknown)"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          proof_branch="proofs/${GITHUB_RUN_ID}"
          git switch -c "$proof_branch"

          # Published figures about the archive are derived, not transcribed.
          # This run has added an archive, so every figure that counts archives
          # has moved. Regenerating before the commit is what makes the proof
          # internally consistent: the archive and the documents that describe
          # it land together, rather than the documents being retyped later.
          if ! python tools/archive_verification_report.py --update-published-surfaces; then
            echo "ERROR: the published archive figures could not be regenerated, so this"
            echo "ERROR: archive would publish beside figures that do not describe it."
            echo "ERROR: The audit itself is complete and verified. Publication is blocked"
            echo "ERROR: until the generator can account for every record it measured."
            exit 1
          fi

          git add proofs/runs/ docs/runs/ docs/latest-run.json docs/monitor-summary.json
          git add docs/archive-errata.md docs/claims-register.md README.md
          git add docs/archive-figures.json

          if [ "${AUDIT_JSON:-}" = "proofs/latest-audit.json" ]; then
            git add proofs/latest-audit.json proofs/latest-audit.html || true
            git add docs/latest-audit.json docs/latest-audit.html || true
            git add policy/isc_policy.signed.json || true
            git add proofs/itgl_ledger.jsonl proofs/itgl_final_hash.txt proofs/latest-attempts.log proofs/run_summary.json || true
          fi
          if [ "${LIVE_AUDIT_UPDATED:-false}" = "true" ]; then
            git add proofs/latest-live-audit.json proofs/latest-live-audit.html
            git add docs/latest-live-audit.json docs/latest-live-audit.html
          fi
          # An incomplete archive is not published evidence. A file named by
          # the signed manifest that git will not carry would make every
          # third-party receipt check fail while CI stayed green. Only the
          # archives this run produced can fail this step; GITHUB_RUN_ID
          # identifies them, and a pre-existing defect in an archive this
          # commit merely touched is reported without blocking publication.
          python tools/check_archive_staged.py --verify-receipt

          if git diff --cached --quiet; then
            echo "Nothing to publish; no proof files changed."
            exit 0
          fi

          git commit -m "SIR Proof: ${CERT_RESULT_STATUS:-UNAVAILABLE} | ${leaks} leaks | ${harmless} harmless | ${stamp}"

          pushed=false
          for attempt in 1 2 3; do
            if git push --set-upstream origin "$proof_branch"; then
              pushed=true
              break
            fi
            echo "Branch push failed on attempt $attempt. Retrying..."
            sleep 2
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: failed to push the proof branch after 3 attempts; nothing was published."
            exit 1
          fi

          {
            echo "Proof artefacts from SIR Real Governance Audit."
            echo
            echo "- Result: ${CERT_RESULT_STATUS:-UNAVAILABLE}"
            echo "- Leaks: ${leaks}"
            echo "- Harmless blocked: ${harmless}"
            echo "- Archive run id: ${LATEST_ARCHIVE_RUN_ID:-unknown}"
            echo "- CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This branch carries only proof artefacts under proofs/ and docs/, plus the"
            echo "signed policy where the run re-signed it. It opens as a pull request rather"
            echo "than pushing to main so the required status checks run against it, which is"
            echo "what the Protect Main ruleset expects and what a direct push from automation"
            echo "cannot satisfy."
          } > /tmp/proof-pr-body.md

          pr_url="$(gh pr create \
            --base main \
            --head "$proof_branch" \
            --title "SIR Proof: ${CERT_RESULT_STATUS:-UNAVAILABLE} | ${leaks} leaks | ${harmless} harmless | ${stamp}" \
            --body-file /tmp/proof-pr-body.md)"

          echo "Opened $pr_url"

          # Auto-merge keeps publication automatic while leaving the required
          # checks in force. If the repository does not allow it, the pull
          # request stays open and that is reported here: publication pending is
          # visible, rather than quietly not happening.
          if gh pr merge --squash --auto "$pr_url"; then
            echo "Auto-merge enabled; the proof publishes once the required checks pass."
          else
            echo "NOTE: auto-merge could not be enabled, so $pr_url is open and awaiting a merge."
            echo "NOTE: the audit itself is complete and verified. Publication is pending, not failed."
          fi

      - name: Finalize CI status (fail if audit failed or inconclusive)
        if: always()
        env:
          AUDIT_JSON: ${{ steps.generate_certificate.outputs.audit_json }}
        run: |
          set -euo pipefail
          echo "AUDIT_PASS=$AUDIT_PASS"
          echo "INCONCLUSIVE=${INCONCLUSIVE:-false}"
          echo "LATEST_RUN_STATUS=${LATEST_RUN_STATUS:-unknown}"
          echo "LATEST_ARCHIVE_RUN_ID=${LATEST_ARCHIVE_RUN_ID:-unknown}"
          echo "LATEST_CI_RUN_URL=${LATEST_CI_RUN_URL:-unknown}"
          echo "LEAKS=$LEAKS"
          echo "HARMLESS_BLOCKED=$HARMLESS_BLOCKED"
          echo "CONTENT_EVALUATED=${CONTENT_EVALUATED:-unknown}"

          if [ "${CANONICAL_PUBLICATION_CONTEXT:-false}" = "true" ] && [ -z "${LATEST_RUN_STATUS:-}" ]; then
            echo "Run marker was not produced; certificate state could not be determined. Failing CI."
            exit 1
          fi

          if [ "${INCONCLUSIVE:-false}" = "true" ]; then
            echo "Audit INCONCLUSIVE. Failing CI after preserving proof."
            exit 1
          fi

          if [ "$AUDIT_PASS" != "true" ]; then
            echo "Audit FAILED (leaks=$LEAKS harmless_blocked=$HARMLESS_BLOCKED). Failing CI after preserving proof."
            exit 1
          fi

          # The counters and the certificate are computed from different inputs
          # by different code, and until 13 October 2026 nothing compared them.
          # AUDIT_PASS comes from tools/ci_audit_verdict.sh, which reads three
          # counter files at a step that runs before the certificate exists. The
          # certificate has six inconclusive conditions that script cannot see:
          # systemic_reset_count > 0, a domain pack that failed to load,
          # prompts_tested <= 0, configurations_observed > 1, and, for a
          # LIVE_GATING_CHECK, any provider call failing or every attempt
          # failing. It shares a seventh, content_evaluated <= 0, which both
          # refuse. The first version of this comment said four and said every
          # provider call rather than any, because it was written by counting
          # the conditions its author had in mind instead of the conditions in
          # tools/generate_certificate.py._compute_audit_result.
          #
          # On main the marker step writes the certificate's INCONCLUSIVE back
          # into the environment, so those were caught there. It is gated on the
          # publication context, so on a branch dispatch they were caught by
          # nothing and the job went green while its own certificate said the run
          # was inconclusive. A branch dispatch is what docs/key-custody.md step 5
          # tells an operator to run before calling a key rotation complete.
          #
          # Both must now agree. Requiring agreement rather than preferring the
          # certificate means a divergence between them is a visible failure
          # instead of a silent preference for one source.
          if [ -z "${AUDIT_JSON:-}" ] || [ ! -f "${AUDIT_JSON:-}" ]; then
            echo "FAILING CI: no certificate was produced, so there is no signed record of this run."
            echo "A run that generated no certificate is not a pass, whatever the counters say."
            exit 1
          fi

          # tools/read_certificate_result.py rather than an inline one-liner, for
          # the reason tools/ci_audit_verdict.sh is a file: a rule nobody can
          # invoke cannot be exercised. The first version let json.load raise
          # under set -e, so a malformed certificate failed the job with a stack
          # trace instead of the message below. The script never raises and
          # prints UNREADABLE or ABSENT instead, so the disagreement message is
          # what a reader sees. tests/test_certificate_result_reader.py executes
          # it directly.
          cert_result="$(python tools/read_certificate_result.py "$AUDIT_JSON")"
          echo "CERTIFICATE_RESULT=$cert_result"
          if [ "$cert_result" != "AUDIT PASSED" ]; then
            echo "FAILING CI: the counters report a pass and the certificate reports '$cert_result'."
            echo "These are computed from different inputs. The script reads three counter files"
            echo "before the certificate exists and cannot see six of its seven inconclusive"
            echo "conditions, so a disagreement usually means the certificate saw something the"
            echo "counters could not, and is a reason to read the certificate rather than a"
            echo "defect in either of them."
            exit 1
          fi

          echo "Audit PASSED. CI green."

  benchmark-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.operation || 'run') == 'benchmark' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Same reason as audit-and-sign: this job publishes by opening a pull
      # request rather than pushing to main, because the Protect Main ruleset
      # requires status checks that a direct push from automation cannot
      # satisfy. The audit job was converted on 12 October 2026; this one was
      # not, and the first paired benchmark afterwards failed on
      # GH013: Repository rule violations.
      pull-requests: write
    env:
      CANONICAL_PUBLICATION_CONTEXT: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ github.ref == 'refs/heads/main' && secrets.SIR_AUDIT_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clean install SIR governance gate (NO CACHE)
        env:
          BENCHMARK_MODE: ${{ github.event.inputs.mode || 'audit' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip uninstall -y sir-firewall sir_firewall || true

          mode="${BENCHMARK_MODE:-audit}"
          echo "Install mode: $mode"

          if [ "$mode" = "live" ]; then
            pip install --no-cache-dir --force-reinstall -e ".[live]"
          else
            pip install --no-cache-dir --force-reinstall -e .
          fi

      - name: Validate pack registry (v1)
        run: |
          set -euo pipefail
          python tools/validate_pack_registry.py --file spec/packs/pack_registry.v1.json

      - name: Validate benchmark run selection tuple
        env:
          DISPATCH_OPERATION: ${{ github.event.inputs.operation || 'benchmark' }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'audit' }}
          DISPATCH_PACK: ${{ github.event.inputs.pack || 'generic_safety' }}
          DISPATCH_PROVIDER: ${{ github.event.inputs.provider || 'xai' }}
          DISPATCH_MODEL: ${{ github.event.inputs.model || 'grok-4.3' }}
        run: |
          set -euo pipefail
          python tools/validate_run_selection.py \
            --operation "${DISPATCH_OPERATION}" \
            --mode "${DISPATCH_MODE}" \
            --pack "${DISPATCH_PACK}" \
            --provider "${DISPATCH_PROVIDER}" \
            --model "${DISPATCH_MODEL}"

      - name: Validate selected benchmark pack schema
        env:
          DISPATCH_PACK: ${{ github.event.inputs.pack || 'generic_safety' }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'audit' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          pack_id = os.environ.get("DISPATCH_PACK", "generic_safety").strip()
          mode = os.environ.get("DISPATCH_MODE", "audit").strip()
          with open("spec/packs/pack_registry.v1.json", "r", encoding="utf-8") as f:
              registry = json.load(f)
          packs = registry.get("packs", [])
          match = next((p for p in packs if p.get("pack_id") == pack_id), None)
          if not match:
              print(f"ERROR: pack_id not found in registry: {pack_id}", file=sys.stderr)
              active_pack_ids = [
                  p.get("pack_id")
                  for p in packs
                  if p.get("status") == "active"
              ]
              print("Active pack_id values:", ", ".join(sorted(pid for pid in active_pack_ids if pid)), file=sys.stderr)
              raise SystemExit(1)

          schema = match.get("schema")
          suite_path = match.get("suite_path")

          if mode in {"audit", "live"} and schema != "csv_single_turn_v1":
              print(
                  'ERROR: benchmark workflow input "mode" values audit/live require a domain CSV pack '
                  "(schema csv_single_turn_v1). "
                  f"pack_id {pack_id!r} has schema {schema!r}.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          cmd = ["python", "tools/validate_domain_pack.py", "--file", suite_path]
          print("Running:", " ".join(cmd))
          raise SystemExit(subprocess.call(cmd))
          PY

      - name: Run paired benchmark through SIR
        id: run_benchmark
        env:
          DISPATCH_PACK: ${{ github.event.inputs.pack || 'generic_safety' }}
          DISPATCH_PROVIDER: ${{ github.event.inputs.provider || 'xai' }}
          DISPATCH_MODEL: ${{ github.event.inputs.model || 'grok-4.3' }}
          BENCHMARK_MODE: ${{ github.event.inputs.mode || 'audit' }}
          SDL_PRIVATE_KEY_PEM: ${{ secrets.SDL_PRIVATE_KEY_PEM }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          mode="${BENCHMARK_MODE:-audit}"
          # A benchmark's baseline half requires live mode from SIR 2.5: with
          # the gate out of the path and no provider calls, an ungated run
          # observes nothing that its prompt set does not already state. The
          # workflow input still defaults to audit, which is correct for a
          # single run, so the benchmark path refuses it here rather than
          # letting the runner refuse it after the job has started publishing.
          if [ "$mode" != "live" ]; then
            echo "ERROR: benchmark requires mode=live; got mode='$mode'." >&2
            echo "An ungated baseline in audit mode runs no gate and calls no provider." >&2
            exit 1
          fi
          provider="${DISPATCH_PROVIDER:-xai}"
          pack="${DISPATCH_PACK:-generic_safety}"
          model="${DISPATCH_MODEL:-grok-4.3}"
          if [ -z "${pack}" ]; then pack="generic_safety"; fi
          if [ -z "${provider}" ]; then provider="xai"; fi
          if [ -z "${model}" ]; then model="grok-4.3"; fi

          echo "Operation: benchmark"
          echo "Benchmark mode: $mode"
          echo "Provider: $provider"
          echo "Pack: $pack"
          echo "Model: $model"

          if [ "$mode" = "live" ]; then
            if [ "$provider" = "xai" ] && [ -z "${XAI_API_KEY:-}" ]; then
              echo "ERROR: benchmark live mode requested for provider=xai but XAI_API_KEY is not configured."
              exit 1
            fi
            if [ "$provider" = "openai" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "ERROR: benchmark live mode requested for provider=openai but OPENAI_API_KEY is not configured."
              exit 1
            fi
          fi

          output_file="$(mktemp)"
          sir benchmark run --mode "$mode" --pack "$pack" --provider "$provider" --model "$model" |
            tee "$output_file"

          gated_run_id="$(
            sed -n 's/^GATED_RUN_ID=//p' "$output_file" |
              tail -n 1
          )"
          baseline_run_id="$(
            sed -n 's/^BASELINE_RUN_ID=//p' "$output_file" |
              tail -n 1
          )"

          if [ -z "$baseline_run_id" ] || [ -z "$gated_run_id" ]; then
            echo "ERROR: benchmark did not emit both BASELINE_RUN_ID and GATED_RUN_ID."
            exit 1
          fi

          gated_cert="proofs/runs/$gated_run_id/audit.json"
          if [ ! -f "$gated_cert" ]; then
            echo "ERROR: gated benchmark certificate not found: $gated_cert"
            exit 1
          fi

          echo "gated_run_id=$gated_run_id" >> "$GITHUB_OUTPUT"
          echo "gated_audit_json=$gated_cert" >> "$GITHUB_OUTPUT"
          echo "baseline_audit_json=proofs/runs/$baseline_run_id/audit.json" >> "$GITHUB_OUTPUT"

      - name: Verify both paired certificates against their run ledgers
        run: |
          set -euo pipefail
          baseline_cert="${{ steps.run_benchmark.outputs.baseline_audit_json }}"
          gated_cert="${{ steps.run_benchmark.outputs.gated_audit_json }}"
          for cert in "$baseline_cert" "$gated_cert"; do
            run_id="$(basename "$(dirname "$cert")")"
            ledger="$(python -c 'import sys; from sir_firewall.evidence_paths import canonical_ledger_path; print(canonical_ledger_path(sys.argv[1]))' "$run_id")"
            python tools/verify_certificate.py "$cert" \
              --ledger "$ledger" \
              --require-registry
          done

      - name: Prepare docs/ for GitHub Pages
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          mkdir -p docs
          touch docs/.nojekyll

      - name: Publish run archive to docs/runs
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          rm -rf docs/runs || true
          cp -R proofs/runs docs/runs
          python tools/prepare_run_archive_page.py docs/runs/index.html

      - name: Validate published run archive index JSON
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          test -f proofs/runs/index.json
          test -f docs/runs/index.json
          python -m json.tool proofs/runs/index.json >/dev/null
          python -m json.tool docs/runs/index.json >/dev/null

      - name: Publish monitor summary to docs/
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        run: |
          set -euo pipefail
          python tools/generate_monitor_summary.py \
            --index proofs/runs/index.json \
            --out docs/monitor-summary.json \
            --window 20

      - name: Publish latest run marker to docs/ (from run index truth)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          # The recognised results are declared once, in tools/certificate_results.py.
          sys.path.insert(0, str(Path("tools").resolve()))
          from certificate_results import UnrecognisedResult, status_for

          index_path = Path("proofs/runs/index.json")
          out_path = Path("docs/latest-run.json")

          payload = json.loads(index_path.read_text(encoding="utf-8"))
          runs = payload.get("runs") if isinstance(payload, dict) else None
          if not isinstance(runs, list) or not runs:
              raise SystemExit("ERROR: proofs/runs/index.json has no runs to publish latest-run marker")

          latest = runs[0]
          if not isinstance(latest, dict):
              raise SystemExit("ERROR: latest run row in proofs/runs/index.json is malformed")

          # D5, as above. A baseline record is not written into
          # proofs/runs/index.json at all; this is the check that says so where
          # the row is read, rather than relying on the publisher alone.
          if "record_kind" in latest:
              raise SystemExit(
                  "ERROR: latest run row in proofs/runs/index.json is not an audit "
                  f"certificate: record_kind={latest['record_kind']!r}"
              )

          # The declared results, and anything else stops the step.
          #
          # Until 13 October 2026 the else branch mapped absent, malformed and
          # unrecognised results to a conclusive FAIL. That was the defect being
          # fixed then: unknown reported as failure tells a reader the same untrue
          # thing as unknown reported as success, because both describe a run the
          # evidence does not describe. Both markers now refuse through the same
          # function, so they cannot disagree about what is recognised.
          result = latest.get("result")
          try:
              status, audit_pass, inconclusive = status_for(result)
          except UnrecognisedResult:
              raise SystemExit(
                  f"ERROR: unsupported latest run result in proofs/runs/index.json: {result!r}"
              )

          timestamp_utc = latest.get("date")
          if not isinstance(timestamp_utc, str) or not timestamp_utc.strip():
              timestamp_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          latest_run_payload = {
              "status": status,
              "audit_pass": audit_pass,
              "inconclusive": inconclusive,
              "leaks": int(latest.get("leaks", 0) or 0),
              "harmless_blocked": int(latest.get("harmless_blocked", 0) or 0),
              "run_id": str(latest.get("run_id", "unknown")),
              "sha": str(os.environ.get("GITHUB_SHA", "")),
              "repository": str(os.environ.get("GITHUB_REPOSITORY", "")),
              "ci_run_url": str(latest.get("ci_run_url", "")),
              "timestamp_utc": timestamp_utc,
          }

          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(latest_run_payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Wrote docs/latest-run.json from proofs/runs/index.json latest row")
          print(json.dumps(latest_run_payload, ensure_ascii=False, indent=2))
          PY

      - name: Compute benchmark gated PASS truth from current gated audit proof
        id: compute_benchmark_gated_pass
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          GATED_AUDIT_JSON: ${{ steps.run_benchmark.outputs.gated_audit_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          gated_path_raw = os.environ.get("GATED_AUDIT_JSON", "").strip()
          canonical_path = Path("proofs/latest-audit.json")
          gated_pass = False

          if gated_path_raw:
              gated_path = Path(gated_path_raw)
              if gated_path.is_file():
                  gated_bytes = gated_path.read_bytes()
                  payload = json.loads(gated_bytes)
                  # Exact comparison, as in tools/certificate_results.py: a
                  # malformed result is not evidence of a passing run.
                  result = payload.get("result") if isinstance(payload, dict) else None
                  gated_pass = (
                      result == "AUDIT PASSED"
                      and canonical_path.is_file()
                      and canonical_path.read_bytes() == gated_bytes
                  )

          value = "true" if gated_pass else "false"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"BENCHMARK_GATED_PASS={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"gated_pass={value}\n")

          print(f"BENCHMARK_GATED_PASS={value}")
          PY

      - name: Compute benchmark live-pointer truth from current paired proofs
        id: compute_benchmark_live_pointer
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          GATED_AUDIT_JSON: ${{ steps.run_benchmark.outputs.gated_audit_json }}
          BASELINE_AUDIT_JSON: ${{ steps.run_benchmark.outputs.baseline_audit_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          module_path = Path("tools/generate_certificate.py")
          spec = importlib.util.spec_from_file_location("generate_certificate", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("ERROR: cannot load certificate generator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          live_path = Path("proofs/latest-live-audit.json")
          eligible = False
          candidates = [
              Path(os.environ.get("GATED_AUDIT_JSON", "")),
              Path(os.environ.get("BASELINE_AUDIT_JSON", "")),
          ]
          expected_bytes = None
          for candidate in candidates:
              if candidate.is_file():
                  candidate_bytes = candidate.read_bytes()
                  certificate = json.loads(candidate_bytes)
                  if module._is_publishable_latest_live(certificate):
                      expected_bytes = candidate_bytes
                      break
          if expected_bytes is not None and live_path.is_file():
              eligible = live_path.read_bytes() == expected_bytes

          value = "true" if eligible else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"updated={value}\n")
          print(f"BENCHMARK_LIVE_POINTER_UPDATED={value}")
          PY

      - name: Publish latest PASS proof to docs/ (benchmark gated PASS only)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true' && steps.compute_benchmark_gated_pass.outputs.gated_pass == 'true'
        run: |
          set -euo pipefail
          test -f proofs/latest-audit.html
          test -f proofs/latest-audit.json
          cp -f proofs/latest-audit.html docs/latest-audit.html
          cp -f proofs/latest-audit.json docs/latest-audit.json

      - name: Publish latest live proof to docs/ (benchmark gated live only)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true' && steps.compute_benchmark_live_pointer.outputs.updated == 'true'
        run: |
          set -euo pipefail
          test -f proofs/latest-live-audit.html
          test -f proofs/latest-live-audit.json
          cp -f proofs/latest-live-audit.html docs/latest-live-audit.html
          cp -f proofs/latest-live-audit.json docs/latest-live-audit.json

      - name: Upload benchmark artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SIR-Benchmark-Proof
          if-no-files-found: ignore
          path: |
            proofs/runs/index.json
            proofs/runs/benchmark_index.v1.json
            proofs/runs/benchmark_index.v2.json
            proofs/runs/pairs/*.json
            proofs/run_id.txt
            proofs/latest-live-audit.json
            proofs/latest-live-audit.html
            proofs/runs/*-gh${{ github.run_id }}*/

      - name: Publish benchmark files by pull request (archive + benchmark index/pairs)
        if: always() && env.CANONICAL_PUBLICATION_CONTEXT == 'true'
        env:
          BENCHMARK_GATED_PASS: ${{ steps.compute_benchmark_gated_pass.outputs.gated_pass }}
          BENCHMARK_LIVE_POINTER_UPDATED: ${{ steps.compute_benchmark_live_pointer.outputs.updated }}
          GH_TOKEN: ${{ secrets.SIR_AUDIT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "SIR Audit Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          benchmark_branch="benchmarks/${GITHUB_RUN_ID}"
          git switch -c "$benchmark_branch"

          # Published figures about the archive are derived, not transcribed.
          # A benchmark dispatch adds archives, so every figure that counts
          # archives has moved. Regenerating before the commit is what makes
          # the benchmark internally consistent: the archives and the documents
          # that describe them land together.
          if ! python tools/archive_verification_report.py --update-published-surfaces; then
            echo "ERROR: the published archive figures could not be regenerated, so these"
            echo "ERROR: archives would publish beside figures that do not describe them."
            echo "ERROR: The benchmark itself is complete. Publication is blocked until the"
            echo "ERROR: generator can account for every record it measured."
            exit 1
          fi

          git add proofs/runs/ docs/runs/ docs/monitor-summary.json docs/latest-run.json
          git add docs/archive-errata.md docs/claims-register.md README.md
          git add docs/archive-figures.json
          if [ "${BENCHMARK_GATED_PASS:-false}" = "true" ]; then
            git add proofs/latest-audit.json proofs/latest-audit.html
            git add docs/latest-audit.json docs/latest-audit.html
          fi
          if [ "${BENCHMARK_LIVE_POINTER_UPDATED:-false}" = "true" ]; then
            git add proofs/latest-live-audit.json proofs/latest-live-audit.html
            git add docs/latest-live-audit.json docs/latest-live-audit.html
          fi

          # An incomplete archive is not published evidence. A file named by
          # the signed manifest that git will not carry would make every
          # third-party receipt check fail while CI stayed green. Only the
          # archives this run produced can fail this step; GITHUB_RUN_ID
          # identifies them, and a pre-existing defect in an archive this
          # commit merely touched is reported without blocking publication.
          python tools/check_archive_staged.py --verify-receipt

          if git diff --cached --quiet; then
            echo "Nothing to publish; no benchmark files changed."
            exit 0
          fi

          git commit -m "SIR Benchmark: paired benchmark dispatch ${stamp}"

          pushed=false
          for attempt in 1 2 3; do
            if git push --set-upstream origin "$benchmark_branch"; then
              pushed=true
              break
            fi
            echo "Branch push failed on attempt $attempt. Retrying..."
            sleep 2
          done

          if [ "$pushed" != "true" ]; then
            echo "ERROR: failed to push the benchmark branch after 3 attempts; nothing was published."
            exit 1
          fi

          {
            echo "Paired benchmark artefacts from SIR Real Governance Audit."
            echo
            echo "- Gated pass: ${BENCHMARK_GATED_PASS:-false}"
            echo "- Live pointer updated: ${BENCHMARK_LIVE_POINTER_UPDATED:-false}"
            echo "- CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This branch carries only benchmark artefacts under proofs/ and docs/. It"
            echo "opens as a pull request rather than pushing to main so the required status"
            echo "checks run against it, which is what the Protect Main ruleset expects and"
            echo "what a direct push from automation cannot satisfy. The audit job was"
            echo "converted to this pattern on 12 October 2026; this job was not, and the"
            echo "first paired benchmark afterwards failed with GH013 after the run had"
            echo "already completed, so the evidence it produced was never published."
          } > /tmp/benchmark-pr-body.md

          pr_url="$(gh pr create \
            --base main \
            --head "$benchmark_branch" \
            --title "SIR Benchmark: paired benchmark dispatch ${stamp}" \
            --body-file /tmp/benchmark-pr-body.md)"

          echo "Opened $pr_url"

          if gh pr merge --squash --auto "$pr_url"; then
            echo "Auto-merge enabled; the benchmark publishes once the required checks pass."
          else
            echo "NOTE: auto-merge could not be enabled, so $pr_url is open and awaiting a merge."
            echo "NOTE: the benchmark itself is complete. Publication is pending, not failed."
          fi
